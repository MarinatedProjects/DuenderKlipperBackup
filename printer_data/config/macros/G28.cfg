[gcode_macro G28]
rename_existing: G28_ORIG
gcode:
    {% if 'Y' not in params and 'X' not in params and 'Z' not in params %}
        G28_ORIG Y
        G28_ORIG X
        G28_ORIG Z
    {% else %}
        {% if 'Y' in params %}
            G28_ORIG Y
        {% endif %}
        {% if 'X' in params %}
            G28_ORIG X
        {% endif %}
        {% if 'Z' in params %}
            G28_ORIG Z
        {% endif %}
    {% endif %}