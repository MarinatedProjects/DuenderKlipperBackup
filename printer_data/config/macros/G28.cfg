[gcode_macro G28]
rename_existing: G28_BASE
gcode:
    {% if 'Y' not in params and 'X' not in params and 'Z' not in params %}
        G28_BASE Y
        G28_BASE X
        G28_BASE Z
    {% else %}
        {% if 'Y' in params %}
            G28_BASE Y
        {% endif %}
        {% if 'X' in params %}
            G28_BASE X
        {% endif %}
        {% if 'Z' in params %}
            G28_BASE Z
        {% endif %}
    {% endif %}