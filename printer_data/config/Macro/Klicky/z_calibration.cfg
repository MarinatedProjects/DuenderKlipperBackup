[z_calibration]
nozzle_xy_position:   -5.5, 86      #<X,Y position where the nozzle touches the Z endstop>
switch_xy_offsets:    -5.5, 47      #<X,Y offset from nozzle_xy_position to the probe switch body>
bed_xy_position:      117.5, 117.5  #<X,Y bed position to probe>
switch_offset:        0.8
before_switch_gcode:  ATTACH_PROBE
end_gcode:            DOCK_PROBE