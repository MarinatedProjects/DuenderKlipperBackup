[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle using frame-mounted brush

# Brush dimensions and position
variable_brush_x_start: 244
variable_brush_width:      6
variable_brush_y:        218

# Safe cleaning/travel Z height
variable_clean_z:         25

# Number of complete back-and-forth wipes
variable_wipe_qty:          3

# Speeds
variable_travel_speed:   9000
variable_wipe_speed:    12000
variable_z_speed:          600

gcode:
    # Make sure printer is homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("Please home your axes before cleaning the nozzle!") }
    {% endif %}

    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE

    G90

    # Move to safe Z height
    G1 Z{clean_z} F{z_speed}

    # Move to the center of the brush
    G1 X{brush_x_start + (brush_width / 2)} Y{brush_y} F{travel_speed}

    # Wipe back and forth across the brush
    {% for wipe in range(wipe_qty) %}
        G1 X{brush_x_start} F{wipe_speed}
        G1 X{brush_x_start + brush_width} F{wipe_speed}
    {% endfor %}

    # Stay at safe Z height and return to previous state
    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE MOVE=1

    M117 Nozzle Cleaned