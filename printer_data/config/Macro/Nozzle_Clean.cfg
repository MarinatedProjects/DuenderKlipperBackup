[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle using box and diagonal pattern on frame-mounted brush

# =========================
# BRUSH DIMENSIONS
# =========================

variable_brush_x_start: 244
variable_brush_x_end:   250

variable_brush_y_start: 193
variable_brush_y_end:   243

# Cleaning Z height
variable_clean_z:        25

# Number of box/diagonal cycles
variable_wipe_qty:        3

# =========================
# SPEEDS
# =========================

variable_travel_speed:  9000
variable_wipe_speed:   12000
variable_z_speed:        600

gcode:

    # Check that printer is homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("Please home your axes before cleaning the nozzle!") }
    {% endif %}

    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE

    G90

    # =========================
    # MOVE SAFELY TO BRUSH
    # =========================

    G1 Z{clean_z} F{z_speed}

    # Move to brush center
    G1 X{(brush_x_start + brush_x_end) / 2} \
       Y{(brush_y_start + brush_y_end) / 2} \
       F{travel_speed}

    # =========================
    # BOX + DIAGONAL SCRUB
    # =========================

    {% for wipe in range(wipe_qty) %}

        # Move to bottom-left
        G1 X{brush_x_start} Y{brush_y_start} F{wipe_speed}

        # Bottom → top on left side
        G1 X{brush_x_start} Y{brush_y_end} F{wipe_speed}

        # Diagonal top-left → bottom-right
        G1 X{brush_x_end} Y{brush_y_start} F{wipe_speed}

        # Right side bottom → top
        G1 X{brush_x_end} Y{brush_y_end} F{wipe_speed}

        # Diagonal top-right → bottom-left
        G1 X{brush_x_start} Y{brush_y_start} F{wipe_speed}

        # Bottom → top diagonal/box combination
        G1 X{brush_x_end} Y{brush_y_end} F{wipe_speed}

        # Top horizontal
        G1 X{brush_x_start} Y{brush_y_end} F{wipe_speed}

        # Return to bottom-right
        G1 X{brush_x_end} Y{brush_y_start} F{wipe_speed}

    {% endfor %}

    # =========================
    # FINISH
    # =========================

    # Raise/maintain safe Z
    G1 Z{clean_z} F{z_speed}

    M117 Nozzle Cleaned

    # Return to position before macro
    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE MOVE=1
