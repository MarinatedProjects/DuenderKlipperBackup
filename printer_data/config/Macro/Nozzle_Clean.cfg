[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle using frame-mounted brush

# =========================
# BRUSH LOCATION
# =========================

# Brush X position
variable_brush_x_start: 244
variable_brush_width:    6

# Brush Y position
variable_brush_front: 193
variable_brush_depth:   50

# Z height where nozzle contacts the brush
# YOU MUST TUNE THIS VALUE
variable_brush_z:        1.0

# =========================
# MOVEMENT SETTINGS
# =========================

# Z height above brush while travelling
variable_clearance_z:    10

# Number of back-and-forth wipes
variable_wipe_qty:       3

# Travel speed when not cleaning
variable_travel_speed:   9000

# Z movement speed
variable_z_speed:        600

# Wipe speed
variable_wipe_speed:     12000

gcode:

    # Make sure printer is homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("Please home your axes before cleaning the nozzle!") }
    {% endif %}

    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE

    G90

    # Calculate brush center
    {% set brush_x_center = brush_x_start + (brush_width / 2) %}
    {% set brush_y_center = brush_front + (brush_depth / 2) %}

    # Move safely above brush
    G1 Z{brush_z + clearance_z} F{z_speed}

    # Move to center of brush
    G1 X{brush_x_center} Y{brush_y_center} F{travel_speed}

    # Lower nozzle into brush
    G1 Z{brush_z} F{z_speed}

    # Wipe back and forth across brush
    {% for wipe in range(wipe_qty) %}
        G1 X{brush_x_start} F{wipe_speed}
        G1 X{brush_x_start + brush_width} F{wipe_speed}
    {% endfor %}

    # Raise nozzle away from brush
    G1 Z{brush_z + clearance_z} F{z_speed}

    M117 Nozzle Cleaned

    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE
