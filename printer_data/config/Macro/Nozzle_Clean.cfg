[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle on frame mounted brush

variable_brush_x_start: 244
variable_brush_x_end: 250
variable_brush_y_start: 193
variable_brush_y_end: 243

variable_clean_z: 25
variable_wipe_qty: 3

variable_travel_speed: 9000
variable_wipe_speed: 12000
variable_z_speed: 600

variable_clean_temp: 150

gcode:
{% if "xy" not in printer.toolhead.homed_axes %}
{ action_raise_error("Please home your axes before cleaning the nozzle!") }
{% endif %}

SAVE_GCODE_STATE NAME=CLEAN_NOZZLE
G90

M117 Heating nozzle to 150C
M109 S{clean_temp}

G1 Z{clean_z} F{z_speed}

G1 X{(brush_x_start + brush_x_end) / 2} Y{(brush_y_start + brush_y_end) / 2} F{travel_speed}

{% for wipe in range(wipe_qty) %}
    G1 X{brush_x_start} Y{brush_y_start} F{wipe_speed}
    G1 X{brush_x_start} Y{brush_y_end} F{wipe_speed}
    G1 X{brush_x_end} Y{brush_y_start} F{wipe_speed}
    G1 X{brush_x_end} Y{brush_y_end} F{wipe_speed}
    G1 X{brush_x_start} Y{brush_y_start} F{wipe_speed}
    G1 X{brush_x_end} Y{brush_y_end} F{wipe_speed}
    G1 X{brush_x_start} Y{brush_y_end} F{wipe_speed}
    G1 X{brush_x_end} Y{brush_y_start} F{wipe_speed}
{% endfor %}

G1 Z{clean_z} F{z_speed}

M104 S0
M117 Nozzle Cleaned

RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE MOVE=1