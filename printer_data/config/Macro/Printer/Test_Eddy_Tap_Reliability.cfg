[gcode_macro _TAP_TEST_STATE]
variable_attempts: 0
variable_passed: 0
gcode:
    # holds counters only

[gcode_macro _TAP_TEST_RUN]
gcode:
    {% set st = printer["gcode_macro _TAP_TEST_STATE"] %}
    {% set n = st.attempts + 1 %}
    SET_GCODE_VARIABLE MACRO=_TAP_TEST_STATE VARIABLE=attempts VALUE={n}
    RESPOND MSG="Tap test: run {n} of {params.TOTAL|default(10)}"
    G90
    G1 Z5 F1200
    G1 X117.5 Y117.5 F12000
    PROBE_EDDY_NG_TAP
    # only reached if the tap succeeded
    SET_GCODE_VARIABLE MACRO=_TAP_TEST_STATE VARIABLE=passed VALUE={st.passed + 1}
    G28 Z

[gcode_macro _TAP_TEST_REPORT]
gcode:
    {% set st = printer["gcode_macro _TAP_TEST_STATE"] %}
    {% set total = params.TOTAL|default(10)|int %}
    {% set rate = ((st.passed / st.attempts * 100)|round|int) if st.attempts > 0 else 0 %}
    RESPOND MSG="Tap test: {st.passed}/{st.attempts} passed ({rate}%)"
    {% if st.attempts >= total and st.passed == st.attempts %}
        RESPOND MSG="RELIABLE: every tap succeeded"
    {% elif st.attempts >= total %}
        RESPOND MSG="NOT RELIABLE: {st.attempts - st.passed} of {st.attempts} taps failed"
    {% else %}
        RESPOND MSG="Test incomplete: {st.attempts} of {total} runs done"
    {% endif %}

[gcode_macro TAP_TEST_STATUS]
gcode:
    _TAP_TEST_REPORT TOTAL={params.TOTAL|default(10)}

[gcode_macro TAP_TEST]
gcode:
    {% set runs = params.RUNS|default(10)|int %}
    {% set resume = params.CONTINUE|default(0)|int %}
    {% set homed = printer.toolhead.homed_axes %}

    # Home XY first if needed
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}

    # Park at the Z homing position, then preheat there
    G90
    G1 X117.5 Y85 F12000
    M140 S60
    M104 S150
    M190 S60
    M109 S150

    # Home Z once everything is at temperature
    G28 Z

    {% if not resume %}
        SET_GCODE_VARIABLE MACRO=_TAP_TEST_STATE VARIABLE=attempts VALUE=0
        SET_GCODE_VARIABLE MACRO=_TAP_TEST_STATE VARIABLE=passed VALUE=0
    {% endif %}

    {% set done = printer["gcode_macro _TAP_TEST_STATE"].attempts if resume else 0 %}
    {% for i in range(done, runs) %}
        _TAP_TEST_RUN TOTAL={runs}
    {% endfor %}

    _TAP_TEST_REPORT TOTAL={runs}