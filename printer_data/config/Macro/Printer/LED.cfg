[gcode_macro RAINBOW_LED]
variable_step: 0
gcode:
    {% set colors = [
        (0.01, 0, 0),
        (0.01, 0.005, 0),
        (0, 0.01, 0),
        (0, 0.01, 0.005),
        (0, 0, 0.01),
        (0.005, 0, 0.01),
        (0.01, 0, 0.01)
    ] %}
    {% set c = colors[printer["gcode_macro RAINBOW_LED"].step % 7] %}
    SET_LED LED=rp2040_led RED={c[0]} GREEN={c[1]} BLUE={c[2]}
    SET_GCODE_VARIABLE MACRO=RAINBOW_LED VARIABLE=step VALUE={(printer["gcode_macro RAINBOW_LED"].step + 1) % 7}
    UPDATE_DELAYED_GCODE ID=RAINBOW_LED_LOOP DURATION=0.5

[delayed_gcode RAINBOW_LED_LOOP]
gcode:
    RAINBOW_LED

    #UPDATE_DELAYED_GCODE ID=RAINBOW_LED_LOOP DURATION=0.1
    #UPDATE_DELAYED_GCODE ID=RAINBOW_LED_LOOP DURATION=0