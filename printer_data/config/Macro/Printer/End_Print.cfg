[gcode_macro END_PRINT]
description: Retract filament, park toolhead and disable heaters
gcode:
    SAVE_GCODE_STATE NAME=END_PRINT_STATE

    ; RETRACT FILAMENT
    M83
    G1 E-2 F3600

    ; LIFT Z
    G91
    G1 Z5 F1200

    ; TURN OFF HEATERS AND FAN
    TURN_OFF_HEATERS
    M107

    ; PARK TOOLHEAD
    G90
    G1 X117.5 Y240 F6000

    ; DISABLE STEPPERS
    M84

    RESTORE_GCODE_STATE NAME=END_PRINT_STATE
