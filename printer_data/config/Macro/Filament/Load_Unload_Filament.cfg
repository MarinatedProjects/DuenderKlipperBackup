[gcode_macro LOAD_FILAMENT]
description: load filament to nozzle and purge
variable_load_distance: 95
variable_purge_distance: 25
variable_min_temp: 230
variable_temp: 250
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set purge_speed = params.PURGE_SPEED|default(180) %}

    {% if printer.extruder.temperature < min_temp %}
        M104 S{temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={min_temp}
    {% endif %}

    SAVE_GCODE_STATE NAME=load_state
    M83

    G1 E50 F{speed}
    G1 E{load_distance - 50} F{speed}
    G1 E{purge_distance} F{purge_speed}

    CLEAN_NOZZLE_HOT

    RESTORE_GCODE_STATE NAME=load_state
    M104 S0
    M117 Filament loaded

[gcode_macro UNLOAD_FILAMENT]
description: retract filament clear of hotend
variable_unload_distance: 95
variable_min_temp: 230
variable_temp: 250
gcode:
    {% set speed = params.SPEED|default(300) %}

    {% if printer.extruder.temperature < min_temp %}
        M104 S{temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={min_temp}
    {% endif %}

    FORM_TIP

    SAVE_GCODE_STATE NAME=unload_state
    M83

    G1 E5 F{speed}
    G1 E-50 F{speed}
    G1 E-{unload_distance - 50} F{speed}

    CLEAN_NOZZLE_HOT

    RESTORE_GCODE_STATE NAME=unload_state
    M104 S0
    M117 Filament unloaded

[gcode_macro CLEAN_NOZZLE_HOT]
description: Clean nozzle at current temperature without waiting
variable_brush_x_start: 244
variable_brush_x_end: 250
variable_brush_y_start: 193
variable_brush_y_end: 243
variable_wipe_slow: 12000
variable_wipe_slow_qty: 1
variable_wipe_fast: 24000
variable_wipe_fast_qty: 2
variable_travel_speed: 9000
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

    G90

    G1 X{(brush_x_start + brush_x_end) / 2} Y{(brush_y_start + brush_y_end) / 2} F{travel_speed}

    # Slow wipe
    {% for wipe in range(wipe_slow_qty) %}
        G1 X{brush_x_start} Y{brush_y_start} F{wipe_slow}
        G1 X{brush_x_start} Y{brush_y_end} F{wipe_slow}
        G1 X{brush_x_end} Y{brush_y_start} F{wipe_slow}
        G1 X{brush_x_end} Y{brush_y_end} F{wipe_slow}
        G1 X{brush_x_start} Y{brush_y_start} F{wipe_slow}
        G1 X{brush_x_end} Y{brush_y_end} F{wipe_slow}
        G1 X{brush_x_start} Y{brush_y_end} F{wipe_slow}
        G1 X{brush_x_end} Y{brush_y_start} F{wipe_slow}
    {% endfor %}

    # Fast wipe
    {% for wipe in range(wipe_fast_qty) %}
        G1 X{brush_x_start} Y{brush_y_start} F{wipe_fast}
        G1 X{brush_x_start} Y{brush_y_end} F{wipe_fast}
        G1 X{brush_x_end} Y{brush_y_start} F{wipe_fast}
        G1 X{brush_x_end} Y{brush_y_end} F{wipe_fast}
        G1 X{brush_x_start} Y{brush_y_start} F{wipe_fast}
        G1 X{brush_x_end} Y{brush_y_end} F{wipe_fast}
        G1 X{brush_x_start} Y{brush_y_end} F{wipe_fast}
        G1 X{brush_x_end} Y{brush_y_start} F{wipe_fast}
    {% endfor %}

    G1 X{printer.toolhead.position.x - 5} F{travel_speed}