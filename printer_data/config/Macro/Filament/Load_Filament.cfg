[gcode_macro LOAD_FILAMENT]
description: Load filament to nozzle and purge
variable_load_distance: 87
variable_purge_distance: 25
gcode:
    {% set speed = params.SPEED|default(300) %}     # mm/min for the fast load
    {% set purge_speed = params.PURGE_SPEED|default(180) %}  # mm/min for the purge
    {% set min_temp = params.MIN_TEMP|default(250) %}

    {% if printer.extruder.temperature < min_temp %}
        { action_raise_error("Extruder too cold to load filament (need %.0fC)" % min_temp) }
    {% endif %}

    SAVE_GCODE_STATE NAME=load_state
    M83                                   ; relative extrusion
    G1 E50 F{speed}                       ; first chunk (under 50mm limit)
    G1 E{load_distance - 50} F{speed}     ; remainder to reach the nozzle
    G1 E{purge_distance} F{purge_speed}   ; purge until clean color/flow
    RESTORE_GCODE_STATE NAME=load_state
    M117 Filament loaded

[gcode_macro UNLOAD_FILAMENT]
description: Retract filament clear of the hotend
variable_unload_distance: 90
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set min_temp = params.MIN_TEMP|default(250) %}

    {% if printer.extruder.temperature < min_temp %}
        { action_raise_error("Extruder too cold to unload filament (need %.0fC)" % min_temp) }
    {% endif %}

    SAVE_GCODE_STATE NAME=unload_state
    M83
    G1 E5 F{speed}                        ; tiny push first, forms a clean tip
    G1 E-50 F{speed}
    G1 E-{unload_distance - 50} F{speed}
    RESTORE_GCODE_STATE NAME=unload_state
    M117 Filament unloaded