[gcode_macro FORM_TIP]
description: Taper the filament tip before full retract
variable_min_temp: 200
variable_temp: 210
variable_taper_pulses: 3
variable_pulse_retract: 4
variable_pulse_extrude: 2
variable_final_retract: 15
gcode:
    {% set fast_speed = params.SPEED|default(1800) %}   # mm/min, oscillation speed
    {% set slow_speed = params.SLOW_SPEED|default(900) %}

    {% if printer.extruder.temperature < min_temp %}
        M109 S{temp}
    {% endif %}

    SAVE_GCODE_STATE NAME=tip_form_state
    M83
    {% for i in range(taper_pulses) %}
        G1 E-{pulse_retract} F{fast_speed}   ; pull back sharply
        G1 E{pulse_extrude} F{slow_speed}    ; small push to re-melt/reshape the point
    {% endfor %}
    G1 E-{final_retract} F{fast_speed}       ; pull the tapered tip clear of the melt zone
    RESTORE_GCODE_STATE NAME=tip_form_state