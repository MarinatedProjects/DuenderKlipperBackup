
[endstop_phase]


[gcode_macro Custom_TEST_SPEED]
description: CoreXY speed test with motor skip detection
gcode:
    {% set p = printer.configfile.settings %}
    {% set th = printer.toolhead %}

    # Test parameters
    {% set speed = params.SPEED|default(p.printer.max_velocity, true)|float %}
    {% set accel = params.ACCEL|default(p.printer.max_accel, true)|float %}
    {% set iterations = params.ITERATIONS|default(5, true)|int %}
    {% set margin = params.MARGIN|default(20, true)|float %}
    {% set threshold = params.THRESHOLD|default(0.15, true)|float %}
    {% set z = params.Z|default(20, true)|float %}
    {% set box = 10.0 %}

    # Motion boundaries
    {% set x0 = p.stepper_x.position_min + margin %}
    {% set x1 = p.stepper_x.position_max - margin %}
    {% set y0 = p.stepper_y.position_min + margin %}
    {% set y1 = p.stepper_y.position_max - margin %}

    {% set cx = (x0 + x1) / 2 %}
    {% set cy = (y0 + y1) / 2 %}
    {% set fr = speed * 60 %}

    # Validate parameters
    {% if speed <= 0 or accel <= 0 or iterations < 1 or threshold <= 0 %}
        { action_raise_error("TEST_SPEED: Invalid speed, acceleration, iterations or threshold.") }
    {% endif %}

    {% if margin < 0 or x0 >= x1 or y0 >= y1 %}
        { action_raise_error("TEST_SPEED: Invalid movement boundaries. Check MARGIN.") }
    {% endif %}

    {% if box * 2 >= (x1 - x0) or box * 2 >= (y1 - y0) %}
        { action_raise_error("TEST_SPEED: Test square is too large for the available area.") }
    {% endif %}

    {% if z <= 0 or z > p.stepper_z.position_max %}
        { action_raise_error("TEST_SPEED: Invalid Z clearance.") }
    {% endif %}

    # Save current motion limits
    {% set old_velocity = th.max_velocity %}
    {% set old_accel = th.max_accel %}
    {% set old_scv = th.square_corner_velocity %}
    {% set old_mcr = th.minimum_cruise_ratio %}

    SAVE_GCODE_STATE NAME=TS

    # Save detection threshold
    SET_GCODE_VARIABLE MACRO=_TS_REPORT VARIABLE=threshold VALUE={threshold}

    # Establish starting position
    G28
    G90
    G0 Z{z} F1200
    G0 X{cx} Y{cy} F18000
    M400

    # Baseline homing
    G28 X Y
    M400

    # Capture baseline motor positions
    _TS_CAPTURE

    # Set test motion limits
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}

    RESPOND TYPE=echo MSG="TEST_SPEED: Starting stress test"
    RESPOND TYPE=echo MSG="TEST_SPEED: Speed={speed} Accel={accel} Iterations={iterations}"

    # Stress test
    {% for i in range(iterations) %}

        # Diagonal movements
        G0 X{x0} Y{y0} F{fr}
        G0 X{x1} Y{y1} F{fr}
        G0 X{x0} Y{y1} F{fr}
        G0 X{x1} Y{y0} F{fr}

        # Horizontal and vertical movements
        G0 X{x0} Y{y0} F{fr}
        G0 X{x0} Y{y1} F{fr}
        G0 X{x1} Y{y1} F{fr}
        G0 X{x1} Y{y0} F{fr}

        # Repeated small square
        {% for j in range(4) %}
            G0 X{cx - box} Y{cy - box} F{fr}
            G0 X{cx - box} Y{cy + box} F{fr}
            G0 X{cx + box} Y{cy + box} F{fr}
            G0 X{cx + box} Y{cy - box} F{fr}
        {% endfor %}

    {% endfor %}

    M400

    # Restore original motion limits
    SET_VELOCITY_LIMIT VELOCITY={old_velocity} ACCEL={old_accel} SQUARE_CORNER_VELOCITY={old_scv} MINIMUM_CRUISE_RATIO={old_mcr}

    # Return to center
    G0 X{cx} Y{cy} F18000
    M400
    G4 P500

    # Final homing
    G28 X Y
    M400

    # Compare motor positions
    _TS_REPORT

    RESTORE_GCODE_STATE NAME=TS


[gcode_macro _TS_CAPTURE]
description: Capture baseline MCU motor positions
gcode:
    {% set ep = printer['endstop_phase']|default({}) %}
    {% set lh = ep.last_home|default({}) %}

    {% if 'stepper_x' not in lh or 'stepper_y' not in lh %}
        { action_raise_error("TEST_SPEED: Missing endstop_phase data. Check [endstop_phase].") }
    {% endif %}

    {% if lh.stepper_x.mcu_position is none or lh.stepper_y.mcu_position is none %}
        { action_raise_error("TEST_SPEED: Invalid baseline MCU positions.") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_TS_REPORT VARIABLE=base_a VALUE={lh.stepper_x.mcu_position}
    SET_GCODE_VARIABLE MACRO=_TS_REPORT VARIABLE=base_b VALUE={lh.stepper_y.mcu_position}


[gcode_macro _TS_REPORT]
description: Analyze motor position differences
variable_base_a: 0
variable_base_b: 0
variable_threshold: 0.15

gcode:
    {% set p = printer.configfile.settings %}
    {% set ep = printer['endstop_phase']|default({}) %}
    {% set lh = ep.last_home|default({}) %}
    {% set v = printer['gcode_macro _TS_REPORT'] %}

    {% if 'stepper_x' not in lh or 'stepper_y' not in lh %}
        { action_raise_error("TEST_SPEED: Missing final homing data.") }
    {% endif %}

    {% if lh.stepper_x.mcu_position is none or lh.stepper_y.mcu_position is none %}
        { action_raise_error("TEST_SPEED: Invalid final MCU positions.") }
    {% endif %}

    # Steps per motor rotation
    {% set steps_a = p.stepper_x.full_steps_per_rotation|default(200) * p.stepper_x.microsteps %}
    {% set steps_b = p.stepper_y.full_steps_per_rotation|default(200) * p.stepper_y.microsteps %}

    # Convert motor step differences to mm of motor rotation
    {% set da = (lh.stepper_x.mcu_position - v.base_a) * p.stepper_x.rotation_distance / steps_a %}
    {% set db = (lh.stepper_y.mcu_position - v.base_b) * p.stepper_y.rotation_distance / steps_b %}

    {% set aa = da|abs %}
    {% set ab = db|abs %}

    {% set fail_a = aa > v.threshold %}
    {% set fail_b = ab > v.threshold %}
    {% set fail = fail_a or fail_b %}

    RESPOND TYPE=echo MSG="========== TEST_SPEED RESULTS =========="
    RESPOND TYPE=echo MSG="Motor A (stepper_x): {'FAIL' if fail_a else 'PASS'} | Difference: {'%.4f'|format(da)} mm"
    RESPOND TYPE=echo MSG="Motor B (stepper_y): {'FAIL' if fail_b else 'PASS'} | Difference: {'%.4f'|format(db)} mm"
    RESPOND TYPE=echo MSG="Detection threshold: {'%.4f'|format(v.threshold)} mm"
    RESPOND TYPE=echo MSG="----------------------------------------"
    RESPOND TYPE=echo MSG="{'FAIL: POSITION DISCREPANCY DETECTED' if fail else 'PASS: NO SIGNIFICANT DISCREPANCY'}"
    RESPOND TYPE=echo MSG="========================================"
