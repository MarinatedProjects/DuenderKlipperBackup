
[gcode_macro Custom_TEST_SPEED]
description: Speed/accel stress test with skip detection
gcode:
    {% set p = printer.configfile.settings %}
    {% set speed = params.SPEED|default(p.printer.max_velocity, true)|float %}
    {% set accel = params.ACCEL|default(p.printer.max_accel, true)|float %}
    {% set iter  = params.ITERATIONS|default(5, true)|int %}
    {% set margin = 20.0 %}
    {% set z = 20.0 %}
    {% set box = 10.0 %}

    {% set x0 = p.stepper_x.position_min + margin %}
    {% set x1 = p.stepper_x.position_max - margin %}
    {% set y0 = p.stepper_y.position_min + margin %}
    {% set y1 = p.stepper_y.position_max - margin %}
    {% set cx = (x0 + x1) / 2 %}
    {% set cy = (y0 + y1) / 2 %}
    {% set fr = speed * 60 %}

    SAVE_GCODE_STATE NAME=TS
    G28
    G90
    G0 Z{z} F1200
    G0 X{cx} Y{cy} F18000
    M400
    G28 X Y
    G0 X{cx} Y{cy} F18000
    M400

    _TS_CAPTURE

    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}

    {% for i in range(iter) %}
        G0 X{x0} Y{y0} F{fr}
        G0 X{x1} Y{y1} F{fr}
        G0 X{x0} Y{y1} F{fr}
        G0 X{x1} Y{y0} F{fr}
        G0 X{x0} Y{y0} F{fr}
        G0 X{x0} Y{y1} F{fr}
        G0 X{x1} Y{y1} F{fr}
        G0 X{x1} Y{y0} F{fr}

        {% for j in range(4) %}
            G0 X{cx - box} Y{cy - box} F{fr}
            G0 X{cx - box} Y{cy + box} F{fr}
            G0 X{cx + box} Y{cy + box} F{fr}
            G0 X{cx + box} Y{cy - box} F{fr}
        {% endfor %}
    {% endfor %}

    M400
    SET_VELOCITY_LIMIT VELOCITY={p.printer.max_velocity} ACCEL={p.printer.max_accel}
    G0 X{cx} Y{cy} F18000
    M400
    G4 P500
    G28 X Y

    _TS_REPORT
    RESTORE_GCODE_STATE NAME=TS
