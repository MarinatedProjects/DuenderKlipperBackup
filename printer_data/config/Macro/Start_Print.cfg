[gcode_macro START_PRINT]
description: Home, bed mesh and set EXTRUDER temp
gcode:
	G90 # use absolute coordinates
	M83 # extruder relative mode
	M140 S[bed_temperature_initial_layer_single] # set final bed temp
	M104 S150 # set temporary nozzle temp to prevent oozing during homing
	G4 S10 # allow partial nozzle warmup
	
	G28 # home all axis
	BED_MESH_CALIBRATE ADAPTIVE=1
	
	PARK_CENTER
	M140 S[bed_temperature_initial_layer_single]  # start bed heating (non-blocking)
	M104 S[nozzle_temperature_initial_layer]       # start nozzle heating (non-blocking)
	M190 S[bed_temperature_initial_layer_single]  # wait for bed
	M109 S[nozzle_temperature_initial_layer]       # wait for nozzle