[gcode_macro G28]
description: Override for G28 XY homing to start Y first to prevent the toolhead from colliding into the AWD front motor
rename_existing: G28.1
gcode:
  # Check if specific axes were requested in the command parameters
  {% set home_x = 'X' in params %}
  {% set home_y = 'Y' in params %}
  {% set home_z = 'Z' in params %}
  
  # If no axes are provided, assume a full home sequence
  {% if not home_x and not home_y and not home_z %}
  {% set home_x = True %}
  {% set home_y = True %}
  {% set home_z = True %}
  {% endif %}
  
  # SAFETY INTERLOCK: Force Y to home if X is requested but Y is not yet homed
  {% if home_x and not home_y %}
  {% if 'y' not in printer.toolhead.homed_axes %}
  { action_respond_info("X homing requested, forcing Y home first for safety.") }
  {% set home_y = True %}
  {% endif %}
  {% endif %}

  # Asynchronous heating: Start heating the nozzle while X/Y home
  {% if home_z %}
  M118 Pre-heating nozzle to 150C...
  M104 S150          ; Set nozzle target to 150C but DO NOT wait
  {% endif %}
  
  # 1. Home Y axis
  {% if home_y %}
  M118 Homing Y axis...
  M117 Homing Y axis...
  G28.1 Y
  {% endif %}
  
  # 2. Home X axis
  {% if home_x %}
  M118 Homing X axis...
  M117 Homing X axis...
  G28.1 X
  {% endif %}
  
  # 3. Wait for Heat, Clean Nozzle, and Home Z axis
  {% if home_z %}
  M118 Waiting for nozzle to reach 150C...
  M117 Heating nozzle...
  M109 S150          ; Wait for nozzle target to ensure it is actually at 150C
  
  M118 Cleaning nozzle...
  CLEAN_NOZZLE       
  
  M118 Homing Z axis...
  M117 Homing Z axis...
  G28.1 Z
  {% endif %}
  
  M118 Homing complete.
  M117