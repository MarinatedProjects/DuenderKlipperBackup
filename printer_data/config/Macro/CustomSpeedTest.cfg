[respond]
[endstop_phase]

[gcode_macro Custom_TEST_SPEED]
description: Speed/accel stress test with skip detection
gcode:
    {% set p = printer.configfile.settings %}
    {% set speed = params.SPEED|default(p.printer.max_velocity, true)|float %}
    {% set accel = params.ACCEL|default(p.printer.max_accel, true)|float %}
    {% set scv   = params.SCV|default(p.printer.square_corner_velocity, true)|float %}
    {% set cr    = params.CR|default(p.printer.minimum_cruise_ratio|default(0.5), true)|float %}
    {% set iter  = params.ITERATIONS|default(5, true)|int %}
    {% set margin = 20.0 %}
    {% set z      = 20.0 %}
    {% set box    = 10.0 %}
    {% set x0 = p.stepper_x.position_min + margin %}
    {% set x1 = p.stepper_x.position_max - margin %}
    {% set y0 = p.stepper_y.position_min + margin %}
    {% set y1 = p.stepper_y.position_max - margin %}
    {% set cx = (x0 + x1) / 2 %}
    {% set cy = (y0 + y1) / 2 %}
    {% set fr = speed * 60 %}
    SAVE_GCODE_STATE NAME=TS
    G28
    G90
    G0 Z{z} F1200
    G0 X{cx} Y{cy} F18000
    M400
    G28 X Y
    G0 X{cx} Y{cy} F18000
    M400
    _TS_CAPTURE
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} SQUARE_CORNER_VELOCITY={scv} MINIMUM_CRUISE_RATIO={cr}
    {% for i in range(iter) %}
        G0 X{x0} Y{y0} F{fr}
        G0 X{x1} Y{y1} F{fr}
        G0 X{x0} Y{y1} F{fr}
        G0 X{x1} Y{y0} F{fr}
        G0 X{x0} Y{y0} F{fr}
        G0 X{x0} Y{y1} F{fr}
        G0 X{x1} Y{y1} F{fr}
        G0 X{x1} Y{y0} F{fr}
        {% for j in range(4) %}
            G0 X{cx - box} Y{cy - box} F{fr}
            G0 X{cx - box} Y{cy + box} F{fr}
            G0 X{cx + box} Y{cy + box} F{fr}
            G0 X{cx + box} Y{cy - box} F{fr}
        {% endfor %}
    {% endfor %}
    M400
    SET_VELOCITY_LIMIT VELOCITY={p.printer.max_velocity} ACCEL={p.printer.max_accel} SQUARE_CORNER_VELOCITY={p.printer.square_corner_velocity} MINIMUM_CRUISE_RATIO={p.printer.minimum_cruise_ratio|default(0.5)}
    G0 X{cx} Y{cy} F18000
    M400
    G4 P500
    G28 X Y
    _TS_REPORT
    RESTORE_GCODE_STATE NAME=TS

[gcode_macro _TS_CAPTURE]
gcode:
    {% set lh = (printer['endstop_phase']|default({})).last_home|default({}) %}
    {% if 'stepper_x' not in lh or lh.stepper_x.mcu_position is none
        or 'stepper_y' not in lh or lh.stepper_y.mcu_position is none %}
        { action_raise_error("TEST_SPEED: no endstop_phase data. Need [endstop_phase] plus TMC UART/SPI on stepper_x and stepper_y.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TS_REPORT VARIABLE=base_a VALUE={lh.stepper_x.mcu_position}
    SET_GCODE_VARIABLE MACRO=_TS_REPORT VARIABLE=base_b VALUE={lh.stepper_y.mcu_position}

[gcode_macro _TS_REPORT]
variable_base_a: 0
variable_base_b: 0
variable_threshold: 0.15
gcode:
    {% set p = printer.configfile.settings %}
    {% set lh = printer['endstop_phase'].last_home %}
    {% set v = printer['gcode_macro _TS_REPORT'] %}
    {% set da = (lh.stepper_x.mcu_position - v.base_a) * p.stepper_x.rotation_distance / (p.stepper_x.full_steps_per_rotation|default(200) * p.stepper_x.microsteps) %}
    {% set db = (lh.stepper_y.mcu_position - v.base_b) * p.stepper_y.rotation_distance / (p.stepper_y.full_steps_per_rotation|default(200) * p.stepper_y.microsteps) %}
    {% set fail = [da|abs, db|abs]|max > v.threshold %}
    RESPOND TYPE=command MSG="action:prompt_begin {'FAIL - skip detected' if fail else 'PASS - no skip detected'}"
    RESPOND TYPE=command MSG="action:prompt_text A {'%.3f'|format(da)} mm / B {'%.3f'|format(db)} mm / limit {'%.3f'|format(v.threshold)} mm"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|{'error' if fail else 'primary'}"
    RESPOND TYPE=command MSG="action:prompt_show"