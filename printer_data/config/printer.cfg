[include mainsail.cfg]
[include Macro/*.cfg]
[include Macro/Klicky/klicky-macros.cfg]
[include Macro/Klicky/klicky-variables.cfg]
[include Macro/Klicky/klicky-bed-mesh-calibrate.cfg]
[exclude_object]

[mcu host]
serial: /tmp/klipper_host_mcu

[mcu]   # SKR mini E3 V3
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3A004A0010504D5930313820-if00

[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C740375B136-if00

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 10000
max_z_velocity: 50
max_z_accel: 100
square_corner_velocity: 15.0

[autotune_tmc stepper_x]
motor: usongshine-17hs4401
tuning_goal: performance

[autotune_tmc stepper_y]
motor: usongshine-17hs4401
tuning_goal: performance

[stepper_x]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC0
position_endstop: 231
position_min: 0
position_max: 232
homing_retract_dist: 5
homing_speed: 50
second_homing_speed: 25

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.9
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC1
position_endstop: 226
position_min: 0
position_max: 244
homing_retract_dist: 20
homing_speed: 50
second_homing_speed: 25

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.9
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
position_max: 240
position_min: -25
homing_speed: 10
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2
hold_current: 0.15
sense_resistor: 0.110
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
full_steps_per_rotation:200
rotation_distance: 22.76
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0.0
max_temp: 320
max_extrude_cross_section:5
min_extrude_temp: 150
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
interpolate: True
run_current: 0.7
sense_resistor: 0.110

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[output_pin beeper]
pin: PB5

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: PB8
sclk_pin: PB9
sid_pin: PD6
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15
menu_timeout: 10

[output_pin beeper]
pin: PB5

[board_pins secondary]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[probe]
pin: ^PC15
x_offset: 0
y_offset: 32.0
#z_offset: 0
speed: 5
lift_speed: 10
samples: 2
samples_result: median
sample_retract_dist: 2

[bed_mesh]
speed: 150
mesh_min: 30, 37        # X=10 (safe margin), Y=5+32=37
mesh_max: 225, 208      # X=225 (safe margin), Y=240-32=208
algorithm: bicubic
probe_count: 3, 3
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 15

#[safe_z_home]
#home_xy_position: 119, 159.5
#speed: 100.0
#z_hop: 10
#z_hop_speed: 15

[adxl345]
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12
axes_map: x,-y,z

[resonance_tester]
accel_chip: adxl345
probe_points: 117.5, 117.5, 10

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 67.0
shaper_type_y = mzv
shaper_freq_y = 59.0

#[resonance_tester] 
#accel_chip: adxl345 
#accel_per_hz: 70 
#probe_points: 117.5, 117.5, 10

