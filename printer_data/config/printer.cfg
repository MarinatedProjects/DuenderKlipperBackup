[include mainsail.cfg]
[include Macro/*.cfg]
[include Macro/Filament/*.cfg]
[include Macro/Printer/*.cfg]
[exclude_object]

[danger_options]
allow_plugin_override: True

[mcu]   # SKR mini E3 V3
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3A004A0010504D5930313820-if00

[mcu Zmotor]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4250304B38353815-if00
restart_method: command

[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C740375B136-if00
is_non_critical: True

[printer]
kinematics: corexy
max_velocity: 500
max_accel:  25000
max_z_velocity: 50
max_z_accel: 100
square_corner_velocity: 10.0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC0
position_endstop: -8
position_min: -8
position_max: 250
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC1
position_endstop: 227
position_min: 0
position_max: 246
homing_retract_dist: 30
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: Zmotor:PC2
dir_pin: Zmotor:PB9
enable_pin: !Zmotor:PC3
microsteps: 16
rotation_distance: 8
position_max: 235
position_min: -25
homing_speed: 15
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

[stepper_z1]
step_pin: Zmotor:PB8
dir_pin: Zmotor:PB7
enable_pin: !Zmotor:PC3
microsteps: 16
rotation_distance: 8

[z_tilt]
z_positions:
    -8, 125   
    243, 125 
points:
    20, 125
    215, 125
speed: 200
horizontal_move_z: 30
retries: 10
retry_tolerance: 0.01

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
full_steps_per_rotation:200
rotation_distance: 22.67895
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0.0
max_temp: 320
max_extrude_cross_section:5
min_extrude_temp: 150
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
pressure_advance: 0.0
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[firmware_retraction]
retract_length: 0.3
retract_speed: 60
unretract_extra_length: 0
unretract_speed: 60

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[board_pins Zmotor]
mcu: Zmotor
aliases:
    EXP1_1=PC6,  EXP1_3=PB10, EXP1_5=PB14, EXP1_7=PB12, EXP1_9=<GND>,
    EXP1_2=PB2,  EXP1_4=PB11, EXP1_6=PB13, EXP1_8=PB15, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: Zmotor:EXP1_7
sclk_pin: Zmotor:EXP1_6
sid_pin: Zmotor:EXP1_8
encoder_pins: ^Zmotor:EXP1_5, ^Zmotor:EXP1_3
click_pin: ^!Zmotor:EXP1_2
menu_timeout: 10

[output_pin beeper]
pin: Zmotor:EXP1_1

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.5
i2c_mcu: eddy
i2c_bus: i2c0a
x_offset: 0
y_offset: 21.42       # replace with your measured offset

[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 15, 25
mesh_max: 220, 220
probe_count: 9, 9
algorithm: bicubic
#scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.

[safe_z_home]
home_xy_position: 117.5, 117.5
z_hop: 0
speed: 200

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set cf = printer.configfile.settings %}
    SET_GCODE_OFFSET_ORIG Z={printer.probe.last_z_result - cf['probe_eddy_current btt_eddy'].z_offset + printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset}
    G90
    G1 Z10 F600

[adxl345]
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12
axes_map: x,-y,z

[resonance_tester]
accel_chip: adxl345
probe_points: 117.5, 117.5, 10

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 70
shaper_type_y: ei
shaper_freq_y: 66.6

[fan_generic always_on_fan]
pin: Zmotor:PA0
max_power: 1.0
shutdown_speed: 0

[delayed_gcode FAN_ON_STARTUP]
initial_duration: 1
gcode:
    SET_FAN_SPEED FAN=always_on_fan SPEED=1.0

# Uncomment this if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[save_variables]
filename: ~/printer_data/config/variables.cfg



# Uncomment this if you are using Eddy as the probe AND the homing endstop
[force_move]
enable_force_move: True # Allows a user to move the z axis down if they have no other means of homing Z and need to calibrate the Eddy.



# Uncomment this if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[delayed_gcode RESTORE_PROBE_OFFSET]
initial_duration: 1.
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if not printer["gcode_macro SET_GCODE_OFFSET"].restored %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={ svv.nvm_offset|default(0) }
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=restored VALUE=True
  {% endif %}



# Uncomment this if you are using Eddy as the probe AND the homing endstop
# Take note of the lines that should only be used if you have a KNOMI installed.
[gcode_macro G28]
rename_existing: G28.1
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set want_z = home_all or 'Z' in params %}
  # Z homing needs XY homed first, so pull them in if they aren't homed yet
  {% set want_y = home_all or 'Y' in params or (want_z and 'y' not in homed) %}
  {% set want_x = home_all or 'X' in params or (want_z and 'x' not in homed) %}

  {% if want_y %}
    G28.1 Y
  {% endif %}
  {% if want_x %}
    G28.1 X
  {% endif %}
  {% if want_z %}
    G28.1 Z
    PROBE
    SET_Z_FROM_PROBE
  {% endif %}
  #SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False # Uncomment this if using a KNOMI and then remove the G28 macro from the KNOMI.cfg



# Uncomment this if you are using Eddy as the probe AND the homing endstop
[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set cf = printer.configfile.settings %}
    SET_GCODE_OFFSET_ORIG Z={printer.probe.last_z_result - cf['probe_eddy_current btt_eddy'].z_offset + printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset}
    G90
    G1 Z{cf.safe_z_home.z_hop}


# Uncomment this if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: Z_OFFSET_APPLY_PROBE_ORIG
gcode:
  SAVE_VARIABLE VARIABLE=nvm_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset }



# Uncomment the lines in this macro if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False  # Mark whether the var has been restored from NVM
variable_runtime_offset: 0
gcode:
  {% if params.Z_ADJUST %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset + params.Z_ADJUST|float }
  {% endif %}
  {% if params.Z %} 
    {% set paramList = rawparams.split() %}
    {% for i in range(paramList|length) %}
      {% if paramList[i]=="Z=0" %}
        {% set temp=paramList.pop(i) %}
        {% set temp="Z_ADJUST=" + (-printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset)|string %}
        {% if paramList.append(temp) %}{% endif %}
      {% endif %}
    {% endfor %}
    {% set rawparams=paramList|join(' ') %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE=0
  {% endif %}
  SET_GCODE_OFFSET_ORIG { rawparams }



# This macro automates a lot of the frequency mapping process and simplifies the steps significantly.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90 # Abs positioning
  G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 } # Allows the user to work it down until it touches.
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}



