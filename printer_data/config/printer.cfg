[include mainsail.cfg]
[include Macro/*.cfg]
[include Macro/Filament/*.cfg]
[include Macro/Printer/*.cfg]
[exclude_object]

[danger_options]
allow_plugin_override: True

[mcu]   # SKR mini E3 V3
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3A004A0010504D5930313820-if00

[mcu Zmotor]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4250304B38353815-if00
restart_method: command

[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C740375B136-if00
is_non_critical: True

[printer]
kinematics: corexy
max_velocity: 500
max_accel:  20000
max_z_velocity: 50
max_z_accel: 100
square_corner_velocity: 10.0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC0
position_endstop: -8
position_min: -8
position_max: 250
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC1
position_endstop: 227
position_min: 0
position_max: 246
homing_retract_dist: 30
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: Zmotor:PC2
dir_pin: Zmotor:PB9
enable_pin: !Zmotor:PC3
microsteps: 16
rotation_distance: 8
position_max: 235
position_min: -25
homing_speed: 15
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

[stepper_z1]
step_pin: Zmotor:PB8
dir_pin: Zmotor:PB7
enable_pin: !Zmotor:PC3
microsteps: 16
rotation_distance: 8

[z_tilt]
z_positions:
    -8, 125   
    243, 125 
points:
    20, 125
    215, 125
horizontal_move_z: 10.0
min_horizontal_move_z: 2.0
adaptive_horizontal_move_z: true
retries: 10
retry_tolerance: 0.01
speed: 200

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    # If Z tilt has not been done yet, correct for any major skew first
    # at 8mm height
    {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1
    {% endif %}
    # Complete with a full Z tilt adjust at 2mm
    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
full_steps_per_rotation:200
rotation_distance: 22.67895
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0.0
max_temp: 320
max_extrude_cross_section:5
min_extrude_temp: 150
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
pressure_advance: 0.0
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[firmware_retraction]
retract_length: 0.3
retract_speed: 60
unretract_extra_length: 0
unretract_speed: 60

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[board_pins Zmotor]
mcu: Zmotor
aliases:
    EXP1_1=PC6,  EXP1_3=PB10, EXP1_5=PB14, EXP1_7=PB12, EXP1_9=<GND>,
    EXP1_2=PB2,  EXP1_4=PB11, EXP1_6=PB13, EXP1_8=PB15, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: Zmotor:EXP1_7
sclk_pin: Zmotor:EXP1_6
sid_pin: Zmotor:EXP1_8
encoder_pins: ^Zmotor:EXP1_5, ^Zmotor:EXP1_3
click_pin: ^!Zmotor:EXP1_2
menu_timeout: 10

[output_pin beeper]
pin: Zmotor:EXP1_1

[homing_override]
axes: xyz
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% set z_homed = 'z' in homed %}
    {% set xy_homed = 'x' in homed and 'y' in homed %}

    {% set do_x = 'X' in params %}
    {% set do_y = 'Y' in params %}
    {% set do_z = 'Z' in params %}

    # No axis specified: home everything
    {% if not (do_x or do_y or do_z) %}
        {% set do_x = True %}
        {% set do_y = True %}
        {% set do_z = True %}
    {% endif %}

    # Z homing requires XY to be homed first
    {% if do_z and not xy_homed %}
        {% set do_x = True %}
        {% set do_y = True %}
    {% endif %}

    # Raise Z before homing XY or Z
    {% if z_homed %}
        G91
        G1 Z5 F1200
        G90
    {% else %}
        SET_KINEMATIC_POSITION Z=0
        G91
        G1 Z10 F1200
        G90
    {% endif %}

    # Home Y before X
    {% if do_y %}
        G28 Y
    {% endif %}

    {% if do_x %}
        G28 X
    {% endif %}

    # Safe Z homing at bed center
    {% if do_z %}
        G90
        G1 X117.5 Y150 F12000
        G28 Z

        G91
        G1 Z2 F1500
        G90
    {% else %}
        {% if not z_homed %}
            SET_KINEMATIC_POSITION CLEAR_HOMED=Z
        {% endif %}
    {% endif %}

#_____________________________________________________________________________________

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0a
x_offset: 0
y_offset: 32.5

#_____________________________________________________________________________________

#[probe_eddy_current btt_eddy]
#sensor_type: ldc1612
#z_offset: 2.5
#i2c_mcu: eddy
#i2c_bus: i2c0a
#x_offset: 0
#y_offset: 32.50       # replace with your measured offset

[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 15, 32.5
mesh_max: 220, 220
probe_count: 9, 9
algorithm: bicubic
#scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.

[adxl345]
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12
axes_map: x,-y,z

[resonance_tester]
accel_chip: adxl345
probe_points: 117.5, 117.5, 10

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 70
shaper_type_y: ei
shaper_freq_y: 66.6

[fan_generic always_on_fan]
pin: Zmotor:PA0
max_power: 1.0
shutdown_speed: 0

[delayed_gcode FAN_ON_STARTUP]
initial_duration: 1
gcode:
    SET_FAN_SPEED FAN=always_on_fan SPEED=1.0

# Uncomment this if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[save_variables]
filename: ~/printer_data/config/variables.cfg



# Uncomment this if you are using Eddy as the probe AND the homing endstop
[force_move]
enable_force_move: True # Allows a user to move the z axis down if they have no other means of homing Z and need to calibrate the Eddy.

