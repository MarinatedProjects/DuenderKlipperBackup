[include mainsail.cfg]
[include macros/*.cfg]
[include shell_command.cfg]
[exclude_object]

[mcu]   # SKR mini E3 V3
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3A004A0010504D5930313820-if00

[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E46740D127315529-if00
is_non_critical: True

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 8000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 32.0
#endstop_pin: ^PC0
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: 0
position_max: 238
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999
driver_SGTHRS: 120
diag_pin: ^PC0

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 32.0
endstop_pin: ^PC1     
position_endstop: 249
position_min: 0
position_max: 249
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
position_max: 240
position_min: -5
endstop_pin: probe:z_virtual_endstop
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.6
hold_current: 0.15
sense_resistor: 0.110
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
full_steps_per_rotation:200
rotation_distance: 22.67895
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0.0
max_temp: 320
max_extrude_cross_section:5
min_extrude_temp: 150
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
interpolate: True
run_current: 0.5
sense_resistor: 0.110

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[output_pin beeper]
pin: PB5

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: PB8
sclk_pin: PB9
sid_pin: PD6
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15
menu_timeout: 10

[output_pin beeper]
pin: PB5

[board_pins secondary]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 0
y_offset: -35
#z_offset: 0.0
speed: 3
lift_speed: 10
samples: 2
sample_retract_dist: 3
samples_result: average

[bed_mesh]
speed: 100
mesh_min: 10, 15
mesh_max: 220, 200
algorithm: bicubic
probe_count: 6, 6
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[safe_z_home]
home_xy_position: 119, 159.5
speed: 100.0
z_hop: 10
z_hop_speed: 15

[adxl345]
cs_pin: pico:gpio1
spi_bus: spi1a
axes_map: x,z,y

[resonance_tester]
accel_chip: adxl345
probe_points:
    # Somewhere slightly above the middle of your print bed
    147,154, 20

[output_pin power_mode] # Improve power stability
pin: pico:gpio23

